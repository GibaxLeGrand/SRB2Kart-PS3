#
# sdl/makefile.cfg for SRB2/SDL
#

#
#SDL...., *looks at Alam*, THIS IS A MESS!
#

ifdef UNIXCOMMON
include sdl/MakeNIX.cfg
endif

ifdef PANDORA
include sdl/SRB2Pandora/Makefile.cfg
endif #ifdef PANDORA

ifdef CYGWIN32
include sdl/MakeCYG.cfg
endif #ifdef CYGWIN32

ifdef SDL_PKGCONFIG
SDL_CFLAGS?=$(shell $(PKG_CONFIG) $(SDL_PKGCONFIG) --cflags)
SDL_LDFLAGS?=$(shell $(PKG_CONFIG) $(SDL_PKGCONFIG) --libs)
else
ifdef PREFIX
	SDL_CONFIG?=$(PREFIX)-sdl2-config
else
	SDL_CONFIG?=sdl2-config
endif

ifdef STATIC
	SDL_CFLAGS?=$(shell $(SDL_CONFIG) --cflags)
	SDL_LDFLAGS?=$(shell $(SDL_CONFIG) --static-libs)
else
	SDL_CFLAGS?=$(shell $(SDL_CONFIG) --cflags)
	SDL_LDFLAGS?=$(shell $(SDL_CONFIG) --libs)
endif
endif


	#use the x86 asm code
ifndef CYGWIN32
ifndef NOASM
	USEASM=1
endif
endif

	OBJS+=$(OBJDIR)/i_video.o $(OBJDIR)/dosstr.o $(OBJDIR)/endtxt.o $(OBJDIR)/hwsym_sdl.o

	OPTS+=-DDIRECTFULLSCREEN -DHAVE_SDL

# Raw cellGcm video backend for PS3 (bypasses SDL2_PSL1GHT's video/render
# path entirely -- see sdl/i_video_ps3_gcm.h). Needs PS3DEV to be set
# (sourced from PS3DK's scripts/env.sh) for its include/lib paths.
ifdef PS3GCM
	OBJS+=$(OBJDIR)/i_video_ps3_gcm.o
	OPTS+=-I$(PS3DEV)/ps3dk/ppu/include
	# -lgcm_cmd is here for ps3tc_fifo_wrap_install() alone: PS3DK's replacement
	# command-FIFO wrap callback. See PS3GCM_VideoInit for why we need it.
	LIBS+=-L$(PS3DEV)/ps3dk/ppu/lib -lrsx -lgcm_cmd -lgcm_sys -lsysutil
endif

ifndef NOHW
	OBJS+=$(OBJDIR)/r_opengl.o $(OBJDIR)/ogl_sdl.o
endif

ifdef NOMIXER
	i_sound_o=$(OBJDIR)/sdl_sound.o
else
	i_sound_o=$(OBJDIR)/mixer_sound.o
	OPTS+=-DHAVE_MIXER
	SDL_LDFLAGS+=-lSDL2_mixer
ifdef PS3GCM
	# 2026-08-30. SRB2Kart keeps every sound effect and every music track as Ogg
	# Vorbis (674 lumps in sounds.kart, 121 in music.kart), so the decoder is not
	# optional here -- without it the game is silent, which is what NOMIXER=1 was
	# giving us. Everything is static on this target: SDL2_mixer calls vorbisfile,
	# vorbisfile calls vorbis, vorbis calls ogg, and the linker only looks forward
	# through archives, so this order is the order.
	SDL_LDFLAGS+=-lvorbisfile -lvorbis -logg
	# ...and then SDL2 and libm AGAIN, at the very end. sdl2-config --libs puts
	# -lSDL2 and -lm near the front, and the linker never looks back through an
	# archive it has already walked: SDL2_mixer needs SDL_LoadWAV_RW out of
	# libSDL2, and libvorbis needs rint/rintf out of libm, both of which come
	# up only once those archives are being pulled. Both symbols are present --
	# verified with nm, they are just passed too early.
	#
	# This is what both reference ports do. IoQuake3-PS3 ends its LIBS with
	# "-lpng -lz -lm"; dragonfly-quake-ps3 spells the reason out in its
	# CMakeLists ("-lm is required by the codec libs") and orders the codecs
	# vorbisfile -> vorbis -> ogg exactly as above.
	SDL_LDFLAGS+=-lSDL2 -lm
endif
endif

ifndef NOTHREADS
	OPTS+=-DHAVE_THREADS
	OBJS+=$(OBJDIR)/i_threads.o
endif

ifdef SDL_TTF
	OPTS+=-DHAVE_TTF
	SDL_LDFLAGS+=-lSDL2_ttf -lfreetype -lz
	OBJS+=$(OBJDIR)/i_ttf.o
endif

ifdef SDL_IMAGE
	OPTS+=-DHAVE_IMAGE
	SDL_LDFLAGS+=-lSDL2_image
endif

ifdef SDL_NET
	OPTS+=-DHAVE_SDLNET
	SDL_LDFLAGS+=-lSDL2_net
endif

ifdef MINGW
ifndef NOSDLMAIN
	SDLMAIN=1
endif
endif

ifdef SDLMAIN
	OPTS+=-DSDLMAIN
else
ifdef MINGW
	SDL_CFLAGS+=-Umain
	SDL_LDFLAGS+=-mconsole
endif
endif

ifndef NOHW
ifdef OPENAL
ifdef MINGW
	LIBS:=-lopenal32 $(LIBS)
else
	LIBS:=-lopenal $(LIBS)
endif
else
ifdef MINGW
ifdef DS3D
	LIBS:=-ldsound -luuid $(LIBS)
endif
endif
endif
endif

CFLAGS+=$(SDL_CFLAGS)
LIBS:=$(SDL_LDFLAGS) $(LIBS)
ifdef STATIC
	LIBS+=$(shell $(SDL_CONFIG) --static-libs)
endif
